<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>スマホ対戦エアホッケー</title>

  <!-- PWA（スマホアプリ化）用メタ設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="エアホッケー">
  <meta name="theme-color" content="#0f172a">
  <!-- アプリ用のアイコン（エアホッケー風） -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase JS SDK (v8: CDN軽量版) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between items-center p-3 font-sans">

  <!-- ヘッダー -->
  <header class="w-full max-w-md flex justify-between items-center bg-slate-800/90 p-3 rounded-xl border border-slate-700 shadow-lg">
    <div class="flex items-center space-x-2">
      <span id="status-indicator" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="status-text" class="text-xs font-semibold text-slate-300">通信準備OK</span>
    </div>
    <div id="role-badge" class="text-xs px-2.5 py-1 rounded-full bg-slate-700 text-slate-300 font-bold hidden">
      ---
    </div>
  </header>

  <!-- メインエリア -->
  <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center my-2 relative">

    <!-- ロビー画面 -->
    <div id="lobby-panel" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl flex flex-col space-y-5">
      <div class="text-center">
        <h1 class="text-2xl font-black text-cyan-400 tracking-wider">オンライン・エアホッケー</h1>
        <p class="text-xs text-slate-400 mt-1">クラウドサーバー経由でヌルヌル対戦！</p>
      </div>

      <!-- ホスト -->
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 flex flex-col items-center">
        <button id="btn-create" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-md transition active:scale-95">
          部屋を作る（ホスト）
        </button>

        <div id="host-info" class="hidden mt-4 w-full flex flex-col items-center space-y-3">
          <div class="text-center">
            <span class="text-xs text-slate-400">あなたの部屋ID（合言葉）</span>
            <div id="room-id-display" class="text-3xl font-black text-amber-400 tracking-widest my-1">----</div>
          </div>
          <div id="qrcode-container" class="bg-white p-2 rounded-xl shadow-md border-2 border-amber-400"></div>
          <p class="text-xs text-slate-400 text-center">相手にQRコードを読み取ってもらうか<br>4桁のIDを入力してもらってください</p>
        </div>
      </div>

      <div class="relative flex py-0.5 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-500">または</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- ゲスト -->
      <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 flex flex-col space-y-3">
        <span class="text-xs text-slate-400 font-semibold">部屋に参加する（ゲスト）</span>
        <div class="flex space-x-2">
          <input type="text" id="input-room-id" maxlength="4" placeholder="4桁ID" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-center text-lg font-bold tracking-widest text-amber-400 uppercase focus:outline-none focus:border-cyan-400">
          <button id="btn-join" class="px-6 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-xl shadow-md transition active:scale-95 whitespace-nowrap">
            参加
          </button>
        </div>
      </div>

      <!-- PWAインストール案内ボタン（非表示から必要時自動表示） -->
      <button id="btn-install-pwa" class="hidden w-full py-2.5 bg-slate-700 hover:bg-slate-600 border border-slate-500 text-amber-300 font-bold text-xs rounded-xl shadow transition flex justify-center items-center space-x-2">
        <span>📱 ホーム画面にアプリとして追加する</span>
      </button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-panel" class="w-full h-full flex flex-col items-center justify-center hidden">
      <!-- スコアボード -->
      <div class="w-full flex justify-between items-center mb-2 px-4 py-1.5 bg-slate-800/90 border border-slate-700 rounded-xl">
        <div class="flex items-center space-x-2">
          <span class="text-xs text-rose-400 font-bold">相手:</span>
          <span id="score-guest" class="text-xl font-black text-rose-400">0</span>
        </div>
        <div class="text-xs font-bold text-slate-400">7点先取</div>
        <div class="flex items-center space-x-2">
          <span class="text-xs text-cyan-400 font-bold">あなた:</span>
          <span id="score-host" class="text-xl font-black text-cyan-400">0</span>
        </div>
      </div>

      <!-- Canvas -->
      <div class="relative w-full aspect-[1/1.6] max-h-[65vh] bg-slate-950 border-4 border-slate-700 rounded-2xl overflow-hidden shadow-2xl flex justify-center items-center">
        <canvas id="game-canvas" class="w-full h-full block"></canvas>

        <!-- 勝敗オーバーレイ -->
        <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col justify-center items-center text-center p-6 hidden">
          <h2 id="overlay-title" class="text-3xl font-black text-amber-400 mb-2">勝利！</h2>
          <p id="overlay-msg" class="text-sm text-slate-300 mb-6">素晴らしいプレイでした！</p>
          <button id="btn-restart" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition active:scale-95 shadow-lg">
            もう一度遊ぶ
          </button>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-xs text-slate-500 text-center">
    Firebase Cloud Sync Air Hockey
  </footer>

  <script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyA_9uiRwryteR9lekydrfBXncQ2OAnIEUQ",
      authDomain: "nantoka-448b3.firebaseapp.com",
      databaseURL: "https://nantoka-448b3-default-rtdb.firebaseio.com",
      projectId: "nantoka-448b3",
      storageBucket: "nantoka-448b3.firebasestorage.app",
      messagingSenderId: "901276290696",
      appId: "1:901276290696:web:c6b1de94f197ff8713d93d",
      measurementId: "G-GYHETNP4Y3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- ゲーム定数 ---
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 640;
    const PADDLE_RADIUS = 28;
    const PUCK_RADIUS = 16;
    const GOAL_WIDTH = 140;

    let isHost = false;
    let myRoomId = '';
    let roomRef = null;

    // 初期マレット位置（全員共通で自分の手前中央）
    const DEFAULT_MY_PADDLE = { x: GAME_WIDTH / 2, y: GAME_HEIGHT - 60 };
    const DEFAULT_OPP_PADDLE = { x: GAME_WIDTH / 2, y: 60 };

    // ゲーム内状態（ホスト基準の座標系）
    let gameState = {
      hostPaddle: { ...DEFAULT_MY_PADDLE },
      guestPaddle: { ...DEFAULT_OPP_PADDLE },
      puck: { x: GAME_WIDTH / 2, y: GAME_HEIGHT / 2, vx: 0, vy: 0 },
      scoreHost: 0,
      scoreGuest: 0,
      isPlaying: false
    };

    // ローカル（自分の画面）の目標座標
    let targetMyPaddle = { ...DEFAULT_MY_PADDLE };
    let targetOppPaddle = { ...DEFAULT_OPP_PADDLE };
    let targetPuck = { x: GAME_WIDTH / 2, y: GAME_HEIGHT / 2 };

    // 描画用の補間位置
    let drawMyPaddle = { ...DEFAULT_MY_PADDLE };
    let drawOppPaddle = { ...DEFAULT_OPP_PADDLE };
    let drawPuck = { x: GAME_WIDTH / 2, y: GAME_HEIGHT / 2 };

    // UI要素
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const roleBadge = document.getElementById('role-badge');
    const lobbyPanel = document.getElementById('lobby-panel');
    const gamePanel = document.getElementById('game-panel');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const hostInfo = document.getElementById('host-info');
    const roomIdDisplay = document.getElementById('room-id-display');
    const qrcodeContainer = document.getElementById('qrcode-container');
    const inputRoomId = document.getElementById('input-room-id');
    const scoreHostEl = document.getElementById('score-host');
    const scoreGuestEl = document.getElementById('score-guest');
    const gameOverlay = document.getElementById('game-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const btnRestart = document.getElementById('btn-restart');
    const btnInstallPwa = document.getElementById('btn-install-pwa');

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // URLパラメータの確認 (QRコード用)
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const joinId = urlParams.get('join');
      if (joinId) {
        inputRoomId.value = joinId;
        joinRoom(joinId);
      }
    });

    // PWA（アプリ化）インストール案内イベント
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstallPwa.classList.remove('hidden');
    });

    btnInstallPwa.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            btnInstallPwa.classList.add('hidden');
          }
          deferredPrompt = null;
        });
      }
    });

    // ホスト：部屋作成
    btnCreate.addEventListener('click', () => {
      isHost = true;
      myRoomId = Math.floor(1000 + Math.random() * 9000).toString();
      roomRef = db.ref('rooms/' + myRoomId);

      roleBadge.textContent = 'ホスト';
      roleBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-cyan-900/80 text-cyan-300 font-bold border border-cyan-700';
      roleBadge.classList.remove('hidden');

      roomIdDisplay.textContent = myRoomId;
      hostInfo.classList.remove('hidden');
      btnCreate.classList.add('hidden');

      qrcodeContainer.innerHTML = '';
      const joinUrl = window.location.origin + window.location.pathname + '?join=' + myRoomId;
      new QRCode(qrcodeContainer, {
        text: joinUrl,
        width: 120,
        height: 120,
        colorDark: "#0f172a",
        colorLight: "#ffffff"
      });

      statusText.textContent = 'ゲストの接続を待っています...';

      // 初期データ書き込み
      resetGame();
      roomRef.set({
        state: gameState,
        status: 'waiting',
        guestPaddleLocal: { ...DEFAULT_MY_PADDLE } // ゲストの初期ローカル位置
      });

      // ゲストの参加を監視
      roomRef.child('status').on('value', (snapshot) => {
        if (snapshot.val() === 'playing') {
          startGame();
        }
      });

      // ゲストのマレット移動を監視
      roomRef.child('guestPaddleLocal').on('value', (snapshot) => {
        const pos = snapshot.val();
        if (pos) {
          targetOppPaddle.x = GAME_WIDTH - pos.x;
          targetOppPaddle.y = GAME_HEIGHT - pos.y;
        }
      });
    });

    // ゲスト：部屋参加
    btnJoin.addEventListener('click', () => {
      const targetId = inputRoomId.value.trim();
      if (targetId.length === 4) {
        joinRoom(targetId);
      } else {
        alert('4桁の部屋IDを入力してください');
      }
    });

    function joinRoom(targetId) {
      isHost = false;
      myRoomId = targetId;
      roomRef = db.ref('rooms/' + myRoomId);

      roleBadge.textContent = 'ゲスト';
      roleBadge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/80 text-emerald-300 font-bold border border-emerald-700';
      roleBadge.classList.remove('hidden');

      statusText.textContent = '部屋に接続中...';

      roomRef.once('value', (snapshot) => {
        if (snapshot.exists()) {
          roomRef.update({ 
            status: 'playing',
            guestPaddleLocal: { ...DEFAULT_MY_PADDLE }
          });
          startGame();

          // ホストからの全体ゲーム状態を監視
          roomRef.child('state').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              gameState = data;
              targetOppPaddle = invertPos(gameState.hostPaddle);
              targetPuck = invertPos(gameState.puck);
              updateScores();

              if (data.gameOver) {
                showGameOver(data.winner);
              } else if (!data.isPlaying && gameOverlay.classList.contains('hidden') === false) {
                hideGameOver();
              }
            }
          });
        } else {
          alert('部屋が見つかりません。IDを確認してください。');
          statusText.textContent = '通信準備OK';
        }
      });
    }

    function startGame() {
      statusIndicator.className = 'w-3 h-3 rounded-full bg-cyan-400 animate-pulse';
      statusText.textContent = '対戦中（リアルタイム同期中）';

      lobbyPanel.classList.add('hidden');
      gamePanel.classList.remove('hidden');

      if (isHost) {
        gameState.isPlaying = true;
        roomRef.child('state').update({ isPlaying: true });
        startHostLoop();
      }

      // 全員共通でスムーズ描画ループを起動
      requestAnimationFrame(renderLoop);
    }

    // タッチ / マウス移動処理（陣地制限）
    function handleMove(e) {
      if (!roomRef) return;

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const scaleX = GAME_WIDTH / rect.width;
      const scaleY = GAME_HEIGHT / rect.height;

      let canvasX = (clientX - rect.left) * scaleX;
      let canvasY = (clientY - rect.top) * scaleY;

      // 共通制限：X軸（左右の壁）
      let clampedX = Math.max(PADDLE_RADIUS, Math.min(GAME_WIDTH - PADDLE_RADIUS, canvasX));

      // 陣地制限：Y軸（自分の手前側半分のみ）
      let minY = GAME_HEIGHT / 2 + PADDLE_RADIUS;
      let maxY = GAME_HEIGHT - PADDLE_RADIUS;
      let clampedY = Math.max(minY, Math.min(maxY, canvasY));

      targetMyPaddle = { x: clampedX, y: clampedY };

      if (isHost) {
        gameState.hostPaddle = { x: clampedX, y: clampedY };
      } else {
        roomRef.child('guestPaddleLocal').set({ x: clampedX, y: clampedY });
      }
    }

    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
    canvas.addEventListener('mousemove', handleMove);

    // 【ホスト限定】物理計算＆サーバー同期ループ
    function startHostLoop() {
      setInterval(() => {
        if (!isHost || !gameState.isPlaying) return;

        // ゲストのマレット位置を補間反映
        gameState.guestPaddle.x += (targetOppPaddle.x - gameState.guestPaddle.x) * 0.4;
        gameState.guestPaddle.y += (targetOppPaddle.y - gameState.guestPaddle.y) * 0.4;

        updatePhysics();

        // サーバーへ状態送信
        roomRef.child('state').set(gameState);
      }, 1000 / 40);
    }

    function updatePhysics() {
      let p = gameState.puck;
      p.x += p.vx;
      p.y += p.vy;

      p.vx *= 0.988;
      p.vy *= 0.988;

      const goalLeft = (GAME_WIDTH - GOAL_WIDTH) / 2;
      const goalRight = (GAME_WIDTH + GOAL_WIDTH) / 2;

      // 壁反射
      if (p.x - PUCK_RADIUS < 0) { p.x = PUCK_RADIUS; p.vx *= -1; }
      if (p.x + PUCK_RADIUS > GAME_WIDTH) { p.x = GAME_WIDTH - PUCK_RADIUS; p.vx *= -1; }

      // ゴール判定（上：ゲストゴール -> ホストの得点）
      if (p.y - PUCK_RADIUS < 0) {
        if (p.x > goalLeft && p.x < goalRight) {
          gameState.scoreHost++;
          checkGoal(true);
          return;
        } else {
          p.y = PUCK_RADIUS; p.vy *= -1;
        }
      }

      // ゴール判定（下：ホストゴール -> ゲストの得点）
      if (p.y + PUCK_RADIUS > GAME_HEIGHT) {
        if (p.x > goalLeft && p.x < goalRight) {
          gameState.scoreGuest++;
          checkGoal(false);
          return;
        } else {
          p.y = GAME_HEIGHT - PUCK_RADIUS; p.vy *= -1;
        }
      }

      checkPaddleCollision(gameState.hostPaddle);
      checkPaddleCollision(gameState.guestPaddle);
    }

    function checkPaddleCollision(paddle) {
      let p = gameState.puck;
      let dx = p.x - paddle.x;
      let dy = p.y - paddle.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      let minDist = PADDLE_RADIUS + PUCK_RADIUS;

      if (dist < minDist) {
        let angle = Math.atan2(dy, dx);
        let overlap = minDist - dist;

        p.x += Math.cos(angle) * overlap;
        p.y += Math.sin(angle) * overlap;

        let speed = Math.max(9, Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 1.15);
        speed = Math.min(speed, 20);

        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
      }
    }

    function checkGoal(isHostScored) {
      updateScores();
      if (gameState.scoreHost >= 7 || gameState.scoreGuest >= 7) {
        gameState.isPlaying = false;
        let winner = gameState.scoreHost >= 7 ? 'host' : 'guest';
        gameState.gameOver = true;
        gameState.winner = winner;
        showGameOver(winner);
        roomRef.child('state').set(gameState);
      } else {
        resetPuck(isHostScored ? -1 : 1);
      }
    }

    function resetPuck(direction) {
      gameState.puck = {
        x: GAME_WIDTH / 2,
        y: GAME_HEIGHT / 2,
        vx: (Math.random() - 0.5) * 4,
        vy: direction * 6
      };
    }

    function resetGame() {
      gameState.scoreHost = 0;
      gameState.scoreGuest = 0;
      gameState.gameOver = false;
      gameState.winner = null;
      gameState.hostPaddle = { ...DEFAULT_MY_PADDLE };
      gameState.guestPaddle = { ...DEFAULT_OPP_PADDLE };
      targetMyPaddle = { ...DEFAULT_MY_PADDLE };
      targetOppPaddle = { ...DEFAULT_OPP_PADDLE };
      updateScores();
      resetPuck(1);
      hideGameOver();
    }

    function updateScores() {
      if (isHost) {
        scoreHostEl.textContent = gameState.scoreHost;
        scoreGuestEl.textContent = gameState.scoreGuest;
      } else {
        scoreHostEl.textContent = gameState.scoreGuest;
        scoreGuestEl.textContent = gameState.scoreHost;
      }
    }

    // 【全員共通】滑らか描画（自分の視点基準）
    function renderLoop() {
      if (isHost) {
        targetOppPaddle = gameState.guestPaddle;
        targetPuck = gameState.puck;
      }

      // 描画位置の補間（LERP）
      drawMyPaddle.x += (targetMyPaddle.x - drawMyPaddle.x) * 0.35;
      drawMyPaddle.y += (targetMyPaddle.y - drawMyPaddle.y) * 0.35;
      drawOppPaddle.x += (targetOppPaddle.x - drawOppPaddle.x) * 0.35;
      drawOppPaddle.y += (targetOppPaddle.y - drawOppPaddle.y) * 0.35;
      drawPuck.x += (targetPuck.x - drawPuck.x) * 0.35;
      drawPuck.y += (targetPuck.y - drawPuck.y) * 0.35;

      drawCanvas();
      requestAnimationFrame(renderLoop);
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // コートライン
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(0, GAME_HEIGHT / 2);
      ctx.lineTo(GAME_WIDTH, GAME_HEIGHT / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(GAME_WIDTH / 2, GAME_HEIGHT / 2, 50, 0, Math.PI * 2);
      ctx.stroke();

      // ゴール枠
      const goalLeft = (GAME_WIDTH - GOAL_WIDTH) / 2;
      ctx.strokeStyle = '#f43f5e';
      ctx.strokeRect(goalLeft, 0, GOAL_WIDTH, 8);
      ctx.strokeStyle = '#06b6d4';
      ctx.strokeRect(goalLeft, GAME_HEIGHT - 8, GOAL_WIDTH, 8);

      // パック（黄色）
      ctx.beginPath();
      ctx.arc(drawPuck.x, drawPuck.y, PUCK_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#fbbf24';
      ctx.fill();
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 自分（手前・水色）
      ctx.beginPath();
      ctx.arc(drawMyPaddle.x, drawMyPaddle.y, PADDLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#06b6d4';
      ctx.fill();
      ctx.strokeStyle = '#0891b2';
      ctx.lineWidth = 4;
      ctx.stroke();

      // 相手（奥・赤色）
      ctx.beginPath();
      ctx.arc(drawOppPaddle.x, drawOppPaddle.y, PADDLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#f43f5e';
      ctx.fill();
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    function invertPos(pos) {
      return { x: GAME_WIDTH - pos.x, y: GAME_HEIGHT - pos.y };
    }

    function showGameOver(winner) {
      let isWinner = (isHost && winner === 'host') || (!isHost && winner === 'guest');
      overlayTitle.textContent = isWinner ? '🎉 勝利！' : '😢 敗北...';
      overlayTitle.className = `text-3xl font-black mb-2 ${isWinner ? 'text-amber-400' : 'text-rose-400'}`;
      overlayMsg.textContent = isWinner ? '見事な勝負でした！おめでとうございます！' : '次は勝てるように頑張りましょう！';
      gameOverlay.classList.remove('hidden');
    }

    function hideGameOver() {
      gameOverlay.classList.add('hidden');
    }

    btnRestart.addEventListener('click', () => {
      if (isHost) {
        resetGame();
        gameState.isPlaying = true;
        roomRef.child('state').set(gameState);
      } else {
        hideGameOver();
      }
    });
  </script>
</body>
</html>
